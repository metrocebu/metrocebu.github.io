<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrocebu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .wordmark {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #1a1a1a;
      margin: 0 0 0.4rem;
    }

    .tagline {
      font-size: 1.1rem;
      color: #666;
      font-weight: 400;
      margin: 0 0 2rem;
      letter-spacing: 0.01em;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #ccc;
      margin: 0 auto 2rem;
    }

    .about {
      max-width: 420px;
      font-size: 0.95rem;
      color: #555;
      line-height: 1.7;
      margin: 0 0 2rem;
    }

    a {
      color: #3a3a3a;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #111;
    }

    .cta {
      font-size: 0.9rem;
      color: #777;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.7rem;
      font-family: monospace;
      line-height: 1.9;
      color: #aaa;
    }
footer .copy {
      color: #2a2a2a;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

  <h1 class="wordmark">Metrocebu</h1>
  <p class="tagline">Hire local. Scale Global.</p>

  <div class="divider"></div>

  <p class="about">
    A dev team building software and working with clients remotely.
    We ship products, support teams, and get things done — wherever the work is.
  </p>

  <footer>
<p class="copy">~/public [ CUSTOS: halangdon ]</p>
    <p class="copy">&copy; 2026</p>
  </footer>

</body>
</html>
